name: "✈️ Deploy to Telegram"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgcloud-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, Push & Migrate on Telegram Serverless
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify TGCLOUD Secret
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then
            echo "::error::Missing repository secret TGCLOUD_TOKEN"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Widget HTML Profile 1 Size Budgets (<= 32KB raw, <= 4096B zlib-9)
        run: node scripts/validate-widgets.js

      - name: Check Telegram Serverless Status
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud status

      - name: Push Modules to Telegram Serverless
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud push --force

      - name: Apply Safe Database Schema Migrations
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud migrate --safe

      - name: Synchronize Bot Webhook with Deployed Handlers
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud webhook sync